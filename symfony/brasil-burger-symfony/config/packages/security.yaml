security:
    password_hashers:
        App\Entity\Gestionnaire:
            algorithm: auto

    providers:
        gestionnaire_provider:
            entity:
                class: App\Entity\Gestionnaire
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: gestionnaire_provider
            custom_authenticator: App\Security\GestionnaireAuthenticator
            logout:
                path: admin_logout
                target: admin_login

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_GESTIONNAIRE }
